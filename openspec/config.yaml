schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  项目：电商个性化推荐系统（演示站，仓库 24301066/gexinghuatuijianxitong，默认分支 main）。
  交付形态：① Windows 桌面应用（wxPython 原生窗口 + 系统 WebView2 渲染，PyInstaller one-folder 分发，双击即用；WebView 不可用时降级到系统浏览器）；② 浏览器开发模式（后端 uvicorn + 前端 dev server）。
  技术栈：Python 3.12 + FastAPI + SQLAlchemy 2 + SQLite（backend/），Vue 3 + Vite（web/），桌面壳 desktop/。
  推荐算法：item-CF + TF-IDF 内容相似 + 时间衰减热门，三路归一化加权融合，MMR 多样性重排，冷启动与降级兜底。
  接口前缀：/api/v1；鉴权：演示账号 + HS256 JWT；请求追踪：X-Request-ID。
  数据：桌面端数据库在 %APPDATA%\GexingTuijian（可用 APP_DATA_DIR 覆盖），确定性生成的演示数据集（明确标注为演示数据），另提供 CSV 导入入口接入真实数据。
  离线评估：按事件时间切分，输出 Recall@K / NDCG@K / Coverage / Novelty 报告。
  约束：不依赖云数据库与外网数据集；服务只监听 127.0.0.1，地址从环境变量/命令行读，不硬编码；界面不得伪造数据，空状态就展示空状态；桌面端离线可用。
  本机环境：没有 Rust（不能用 Tauri）；WebView2 运行时已装；python 临时目录 ACL 需要 sitecustomize workaround（见 tools/setup_dev.ps1）。
  运行：本机 git 直连 GitHub 的 pack 传输不可用，推送走 GitHub Git Data API。

