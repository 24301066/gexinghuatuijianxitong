seed: 20261029

# 五路召回的融合权重（相对值，内部会归一化）
weights:
  cf: 0.35
  content: 0.25
  popular: 0.15
  keyword: 0.15   # 最近搜索关键词
  dwell: 0.10     # 安利帖子停留时长

diversity:
  lambda: 0.7              # MMR 相关性权重，越小越强调多样性
  max_category_ratio: 0.4  # 单一类目在推荐结果中的占比上限

recall:
  max_history: 20          # 每个用户最多取多少个最近交互物品做召回锚点
  max_keywords: 5          # 关键词偏好只取最近 N 条搜索词
  max_results: 50          # 每次重排的固定窗口，保证翻页顺序稳定
  popular_half_life_days: 14.0
  viewed_penalty: 0.9      # 看过但没买的商品在融合分上降权

eval:
  cutoffs: [5, 10]
  split_ratio: 0.8
  strategies: [popular, hybrid]

data:
  demo:
    users: 200
    items: 400
    events: 12000
    posts: 60
