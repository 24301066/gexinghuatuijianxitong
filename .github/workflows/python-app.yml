# CI for the recommendation demo: backend tests, end-to-end smoke, offline evaluation
# reproducibility, and the Vue build.
#
# Why it looks like this:
# - requirements.txt pins SQLAlchemy 2.1.x, which requires Python >= 3.11, so the
#   starter workflow's Python 3.10 could never install it.
# - tests live in backend/tests, so pytest must run from backend/ (a bare pytest at
#   the repo root exits with code 5 "no tests collected").
# - the workflow is checked in on the feature branch, so it also runs on feature/**.

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests -q
      - name: End-to-end smoke
        run: |
          mkdir -p .tmp
          python tools/smoke.py
      - name: Offline evaluation smoke
        run: |
          python tools/seed_demo.py --data-dir .tmp/appdata
          cd backend
          python -m eval.run_eval --data-dir ../.tmp/appdata --out ../.tmp/eval-report
      - name: OpenAPI drift check
        run: python tools/dump_openapi.py --check

  web:
    name: web (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: web
        run: npm run build
